name: Build GOJO CLIENT
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'build.gradle', 'settings.gradle', 'gradle.properties', 'src/**', '.github/workflows/gojo-client-build.yml' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GOJO-CLIENT-1.21.11
          path: build/libs/GOJO-CLIENT-1.21.11-*.jar
